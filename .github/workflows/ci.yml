name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Checks, Postgres invariants and Cloudflare preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voidnote_test
          POSTGRES_PASSWORD: voidnote_test
          POSTGRES_DB: voidnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voidnote_test -d voidnote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      TEST_DATABASE_URL: postgresql://voidnote_test:voidnote_test@127.0.0.1:5432/voidnote_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint without warnings
        run: bun run lint --max-warnings=0

      - name: Check runtime and test types
        run: bun run typecheck

      - name: Test Workers telemetry lifecycle
        run: bun run test:worker

      - name: Test PostgreSQL transactions and workspace isolation
        run: bun run test:db

      - name: Test Supabase auth boundary
        run: bun run test:auth

      - name: Build the production Worker
        run: bun run build:worker

      - name: Validate Worker packaging without deploying
        run: bun run deploy:check

      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium

      - name: Test the local Cloudflare production preview
        run: bun run test:e2e

      - name: Upload browser test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
